AllCops:
  NewCops: enable

Layout/LineLength:
  Max: 120

Lint/UnusedMethodArgument:
  Enabled: false

Metrics/AbcSize:
  Max: 35

Metrics/MethodLength:
  Max: 30

Metrics/ModuleLength:
  Max: 150

Style/Documentation:
  Enabled: false

Style/ModuleFunction:
  EnforcedStyle: extend_self

Style/ClassAndModuleChildren:
  Enabled: false