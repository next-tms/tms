inherit_gem: { rubocop-next: rubocop.yml }

AllCops:
  NewCops: enable
GraphQL/ArgumentUniqueness:
  Enabled: false
GraphQL/ObjectDescription:
  Enabled: false
Layout/EndAlignment:
  EnforcedStyleAlignWith: keyword
Layout/LineLength:
  AllowedPatterns:
    - '\A#  '
Naming/PredicateMethod:
  AllowedMethods:
    - call
    - edit
    - index
    - new
    - show
Rails/ActionOrder:
  Enabled: false
Rails/ActiveRecordCallbacksOrder:
  Enabled: false
Rails/AddColumnIndex:
  Enabled: true
Rails/CreateTableWithTimestamps:
  Enabled: true
  Exclude:
    - 'db/migrate/{2016,2017,2018,2019,2020,2021,2022,2023}*.rb'
    - 'db/migrate/20260730162110_drop_shipment_items.rb'
Rails/NotNullColumn:
  Exclude:
    - 'db/migrate/{2020,2021,2022}*.rb'
Rails/SkipsModelValidations:
  Exclude:
    - 'db/migrate/*.rb'
Rails/ThreeStateBooleanColumn:
  Exclude:
    - 'db/migrate/{2016,2017,2018,2019,2020,2021,2022,2023}*.rb'
    - 'db/migrate/20261023062118_drop_brokers.rb'
RSpec/ExpectActual:
  Enabled: false
RSpec/SpecFilePathFormat:
  CustomTransform:
    FetchShipmentCarrierBOLsJob: fetch_shipment_carrier_bols_job
    FetchShipmentCarrierPODsJob: fetch_shipment_carrier_pods_job
    GraphQLClient: graphql_client
    GraphQLQuery: graphql_query
    GraphQLSchema: graphql_schema
