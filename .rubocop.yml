inherit_gem: { rubocop-rails-omakase: rubocop.yml }
plugins:
  - rubocop-graphql
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
GraphQL/ArgumentDescription:
  Enabled: false
GraphQL/ArgumentUniqueness:
  Enabled: false
GraphQL/ExtractInputType:
  Enabled: false
GraphQL/ExtractType:
  Enabled: false
GraphQL/FieldDescription:
  Enabled: false
GraphQL/ObjectDescription:
  Enabled: false
Layout/EndAlignment:
  EnforcedStyleAlignWith: keyword
Layout/LineLength:
  Max: 140
Rails/AddColumnIndex:
  Enabled: true
Rails/CreateTableWithTimestamps:
  Enabled: true
  Exclude:
    - 'db/migrate/{2016,2017,2018,2019,2020,2021,2022,2023}*.rb'
Rails/RootJoinChain:
  Enabled: true
Rails/RootPathnameMethods:
  Enabled: true
RSpec/AnyInstance:
  Enabled: false
RSpec/ExpectActual:
  Enabled: false
RSpec/LetSetup:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/ExampleLength:
  Max: 10
RSpec/MultipleMemoizedHelpers:
  Max: 20
RSpec/NestedGroups:
  Max: 10
RSpecRails/InferredSpecType:
  Enabled: true
Style/FileRead:
  Enabled: true
Style/FileWrite:
  Enabled: true
Style/HashSyntax:
  EnforcedShorthandSyntax: always
Style/StringLiterals:
  EnforcedStyle: single_quotes
