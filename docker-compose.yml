services:
  app: &app
    build: .
    env_file:
      - path: ./.env.example
      - path: ./.docker-compose.env
        required: false
    environment:
      AWS_ACCESS_KEY_ID: liftoff
      AWS_ENDPOINT_URL_S3: http://s3.localhost:9000
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: liftoff
      AWS_SECRET_ACCESS_KEY: liftoff-secret
      CABLE_DATABASE_URL: postgres://liftoff:liftoff@db:5433/liftoff_cable
      CACHE_DATABASE_URL: postgres://liftoff:liftoff@db:5433/liftoff_cache
      DATABASE_URL: postgres://liftoff:liftoff@db:5433/liftoff
      DOMAIN: localhost:3000
      FORCE_SSL: false
      GOTENBERG_URL: http://gotenberg:3000
      QUEUE_DATABASE_URL: postgres://liftoff:liftoff@db:5433/liftoff_queue
      RACK_ENV: production
      RAILS_ENV: production
      TRANSPONDER_URL: http://transponder:2300/graphql
    depends_on:
      bucket:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      transponder:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
  jobs:
    <<: *app
    command: bin/jobs
    ports: []
  migrate:
    <<: *app
    command: bin/rails db:prepare
    depends_on:
      db:
        condition: service_healthy
    ports: []
  bucket:
    command:
      - sh
      - -c
      - |
        aws configure set default.s3.addressing_style path
        aws s3api head-bucket --bucket liftoff 2>/dev/null || aws s3api create-bucket --bucket liftoff
        aws s3api put-bucket-policy --bucket liftoff --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::liftoff/*"}]}'
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: []
    environment:
      AWS_ACCESS_KEY_ID: liftoff
      AWS_ENDPOINT_URL: http://s3:9000
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: liftoff-secret
    image: amazon/aws-cli
  db:
    command:
      - sh
      - -c
      - |
        docker-entrypoint.sh postgres &
        until pg_isready -h 127.0.0.1 -U liftoff; do sleep 1; done
        for database in liftoff liftoff_cable liftoff_cache liftoff_queue; do
          if ! psql -h 127.0.0.1 -U liftoff -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$$database'" | grep -q 1; then
            echo "Creating database $$database"
            createdb -h 127.0.0.1 -U liftoff "$$database"
          fi
        done
        wait
    environment:
      PGPASSWORD: liftoff
      PGPORT: 5433
      POSTGRES_PASSWORD: liftoff
      POSTGRES_USER: liftoff
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U liftoff -d liftoff_queue -c 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 120s
    image: postgres:18.6-alpine3.24
    volumes:
      - ./data/postgres:/var/lib/postgresql
  gotenberg:
    image: gotenberg/gotenberg:8.9.0
  s3:
    environment:
      RUSTFS_ACCESS_KEY: liftoff
      RUSTFS_SECRET_KEY: liftoff-secret
      RUSTFS_SERVER_DOMAINS: s3.localhost:9000
      RUSTFS_VOLUMES: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    image: rustfs/rustfs:1.0.4
    networks:
      default:
        aliases:
          - liftoff.s3.localhost
          - s3.localhost
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3:/data
  transponder:
    env_file:
      - path: ./.transponder.env
        required: false
    image: registry.fly.io/transponder:main
    platform: linux/amd64
volumes:
  s3:
