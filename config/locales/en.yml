        index:
          intro_html: >-
            %{model_name_plural} let this carrier send invoices to <code>/api/dsdc/v1/invoices</code> and supporting documents to
            <code>/api/dsdc/v1/documents</code> with the NMFTA DSDC Invoice and Documents API. Each invoice becomes a bill. Send the key to
            the carrier. The carrier sends it in the <code>X-API-Key</code> header or as <code>Authorization: Bearer</code>. Carrier keys do
            not expire. Roll or destroy a key to stop it.
          never: Never
          new: New
        new:
          error: "Unable to save %{model_name}:"
          submit: Save
          title: New %{model_name}
        show:
          copy: Click the key to copy it.
