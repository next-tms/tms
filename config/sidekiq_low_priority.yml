:concurrency: <%= ENV.fetch("SIDEKIQ_LOW_PRIORITY_CONCURRENCY") { 2 } %>
:scheduler:
  :schedule:
    cancel_shipments:
      cron: '30 * * * *'
      class: CancelShipmentsJob
    create_payments:
      cron: '15 */2 * * *'
      class: CreatePaymentsJob
    create_receivables:
      cron: '10 */2 * * *'
      class: CreateReceivablesJob
    fetch_carrier_bols:
      cron: '0 */4 * * *'
      class: FetchShipmentCarrierBOLsJob
    fetch_carrier_pods:
      cron: '30 */4 * * *'
      class: FetchShipmentCarrierPODsJob
    fetch_receivable_invoices:
      cron: '50 * * * *'
      class: FetchReceivableInvoicesJob
    fetch_shipment_pros:
      cron: '*/15 * * * *'
      class: FetchShipmentProsJob
    push_receivables_to_quickbooks:
      cron: '*/90 * * * *'
      class: PushReceivablesToQuickbooksJob
    track_shipments_pending_delivery:
      cron: '*/30 * * * *'
      class: TrackShipmentsPendingDeliveryJob
    track_shipments_pending_departure:
      cron: '15 */4 * * *'
      class: TrackShipmentsPendingDepartureJob
    track_shipments_pending_pickups:
      cron: '*/15 * * * *'
      class: TrackShipmentsPendingPickupJob
    send_receivables:
      cron: '45 */2 * * *'
      class: SendReceivablesJob
    update_receivables_from_quickbooks_job:
      cron: '40 */2 * * *'
      class: UpdateReceivablesFromQuickbooksJob
:queues:
  - 'default'
