version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    registries:
      - github-registry
    insecure-external-code-execution: allow

registries:
  github-registry:
    type: git
    url: https://github.com
    username: "${{ secrets.BUNDLER_GITHUB_USERNAME }}"
    password: ${{ secrets.BUNDLER_GITHUB_OAUTH_KEY }}
