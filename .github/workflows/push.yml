name: Push Image
on:
  push:
    branches:
      - master
env:
  BUNDLER_GITHUB_OAUTH_KEY: ${{ secrets.BUNDLER_GITHUB_OAUTH_KEY }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLIGHT_SERVICE_ACCOUNT_USERNAME: ${{ secrets.FLIGHT_SERVICE_ACCOUNT_USERNAME }}
  FLIGHT_SERVICE_ACCOUNT_PASSWORD: ${{ secrets.FLIGHT_SERVICE_ACCOUNT_PASSWORD }}
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  push:
    name: Push
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: styfle/cancel-workflow-action@0.9.1
      - uses: actions/checkout@v2
      - uses: docker/setup-buildx-action@v1
      - uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Configure Docker
        uses: docker/login-action@v1
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: registry.fly.io/next-tms:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
          build-args: BUNDLER_GITHUB_OAUTH_KEY=${{ secrets.BUNDLER_GITHUB_OAUTH_KEY }}
      - run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Notify Flight
        run: |
          curl -v \
               -H 'Accept: application/json' \
               -H 'Content-Type: application/json' \
               -u "${FLIGHT_SERVICE_ACCOUNT_USERNAME}:${FLIGHT_SERVICE_ACCOUNT_PASSWORD}" \
               -d "{\"build\": {\"app_kind\": \"tms\", \"build_number\": ${{ github.run_number }}, \"commit_hash\": \"${{ github.sha }}\", \"image_url\": \"https://registry.fly.io/next-tms:${{ github.sha }}\"}}" \
               'https://flight.next-tms.com/api/v1/builds'
