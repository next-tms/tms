name: Checks
on:
  push:
    branches:
      - '**'
      - '!master'
  workflow_call:
    secrets:
      BUNDLER_GITHUB_OAUTH_KEY:
        required: true
env:
  AWS_ACCESS_KEY_ID: fake-access-key-id-for-build-env
  AWS_BUCKET: fake-bucket-for-build-env
  AWS_CDN_HOST: fake-cdn-host-for-build-env
  AWS_ENDPOINT: https://fake-endpoint-for-build-env
  AWS_REGION: fake-region-for-build-env
  AWS_SECRET_ACCESS_KEY: fake-secret-access-key-for-build-env
  DATABASE_URL: postgresql://postgres:password@localhost/liftoff_test
  GEONAMES_USERNAME: fake-username-for-build-env
  POSTMARK_API_TOKEN: fake-api-token-for-build-env
  RAILS_ENV: test
  SECRET_KEY_BASE: fake-secret-key-base-for-build-env
  SMARTY_STREETS_AUTH_ID: fake-auth-id-for-build-env
  SMARTY_STREETS_AUTH_TOKEN: fake-auth-token-for-build-env
jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.7
      - run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev
      - run: |
          gem install bundler
          bundle config github.com "${{ secrets.BUNDLER_GITHUB_OAUTH_KEY }}"
          bundle install --jobs 4 --retry 3
      - run: bundle exec rubocop --only Lint/Syntax
  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.7
      - run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev libpq-dev
      - run: |
          gem install bundler
          bundle config github.com "${{ secrets.BUNDLER_GITHUB_OAUTH_KEY }}"
          bundle install --jobs 4 --retry 3
      - run: bin/rails db:create db:schema:load
      - run: bundle exec rspec
