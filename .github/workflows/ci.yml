name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libmagickwand-dev
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libmagickwand-dev
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  scan_dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan for common security vulnerabilities using Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          exit-code: 1
          severity: CRITICAL,HIGH

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libmagickwand-dev
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint Ruby code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      RAILS_ENV: test
      AWS_ACCESS_KEY_ID: fake-access-key-id-for-build-env
      AWS_CDN_HOST: fake-cdn-host-for-build-env
      AWS_ENDPOINT_URL_S3: https://fake-endpoint-for-build-env
      AWS_REGION: fake-region-for-build-env
      AWS_S3_BUCKET: fake-bucket-for-build-env
      AWS_SECRET_ACCESS_KEY: fake-secret-access-key-for-build-env
      POSTMARK_API_TOKEN: fake-api-token-for-build-env
      SECRET_KEY_BASE: fake-secret-key-base-for-build-env
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libmagickwand-dev libpq-dev
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Cache Bootsnap
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: bootsnap-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'app/**/*.rb', 'lib/**/*.rb') }}
          path: tmp/cache
          restore-keys: bootsnap-${{ runner.os }}-
      - name: Set up database
        run: bin/rails db:create db:schema:load
      - name: Build assets
        run: bin/rails dartsass:build
      - name: Run tests
        run: bundle exec rspec

  push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [scan_ruby, scan_js, scan_dockerfile, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: registry.fly.io/next-tms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify Flight
        run: |
          curl -v \
               -H 'Accept: application/json' \
               -H 'Content-Type: application/json' \
               -u "${{ secrets.FLIGHT_SERVICE_ACCOUNT_USERNAME }}:${{ secrets.FLIGHT_SERVICE_ACCOUNT_PASSWORD }}" \
               -d "{\"build\": {\"app_kind\": \"tms\", \"build_number\": ${{ github.run_number }}, \"commit_hash\": \"${{ github.sha }}\", \"image_url\": \"https://registry.fly.io/next-tms:${{ github.sha }}\"}}" \
               'https://flight.next-tms.com/api/v1/builds'
