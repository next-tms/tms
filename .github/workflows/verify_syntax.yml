name: Verify syntax
on:
  push:
    branches:    
      - '**'
      - '!master'
jobs:
  syntax:
    name: Verify syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.2
      - name: Install rubocop
        run: gem install rubocop
      - name: Run rubocop
        run: rubocop --only Lint/Syntax
