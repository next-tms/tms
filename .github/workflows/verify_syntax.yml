name: Checks
on:
  push:
    branches:
      - '**'
      - '!master'
jobs:
  syntax:
    name: Verify Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.3
      - run: bundle install
      - run: bundle exec rubocop --only Lint/Syntax
